name: Acompli
description: Acompli was a mobile email application for iOS and Android, first released in April 2014, that
  unified email, calendar, contacts, and file management across Microsoft Exchange, Office 365, Google Apps,
  Gmail, iCloud, Yahoo, and Outlook.com/Hotmail accounts. The San Francisco startup was backed by Redpoint
  Ventures and acquired by Microsoft on December 1, 2014 for a reported $200M+, after which its 21-person
  team and product were rebranded as Microsoft Outlook for iOS and Android. Acompli no longer operates as an
  independent company and never published a public developer API; this profile is retained in the API
  Evangelist network as a historical, acquired-company lead.
